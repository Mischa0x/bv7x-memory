# Atom parity — the foundation check.
#
# Two independent halves, deliberately in separate jobs:
#   1. oracle   — regenerate expected.json from the VENDORED production evaluator and
#                 diff it against the committed copy. Red means the vendored JS and the
#                 committed expectations disagree (someone refreshed one, not the other).
#   2. parity   — the stdlib Python evaluator against the committed expectations, on
#                 every one of the frozen live rows. Red means the port drifted from
#                 production semantics.
#
# Neither job needs the database or a Sibyl account — that is the judge-simulation rule
# from the plan, and it is why the fixtures are committed rather than generated here.
name: parity
on: [push, pull_request]
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: regenerate expected.json from vendored predicateEval.js
        run: node tests/regen_expected.js
      - name: committed expectations must match the vendored oracle byte for byte
        run: git diff --exit-code -- tests/fixtures/expected.json
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: python evaluator agrees with production on every live row
        run: python3 -m unittest tests.test_parity -v

  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: the record logic runs on the stdlib (no client)
        run: python3 -m unittest tests.test_record -v
      - name: the screen serves, and the gate holds over HTTP, with no store present
        run: python3 -m unittest tests.test_server -v
      - name: the cohort test detects real clustering and refuses it where absent
        run: python3 -m unittest tests.test_cohorts -v
      - name: install the Sibyl client and run the gate end to end
        run: |
          pip install sibyl-memory-client==0.7.0
          python3 -m unittest tests.test_record.Live -v
          python3 -m unittest tests.test_server -v
          ./deletion-test.sh
